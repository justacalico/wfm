<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Script - WFM</title>
<link rel="icon" href="icon.svg">
<style>
  html, body { margin: 0; height: 100%; background: #14161a; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; background: #14161a; color: #ccc; font: 14px system-ui, sans-serif; z-index: 5; }
  #overlay.hidden { display: none; }
  #overlay button { padding: 6px 14px; margin: 0 4px; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #333; color: #eee; padding: 8px 16px; border-radius: 4px; display: none; font: 13px system-ui, sans-serif; z-index: 6; }
  html.oled, html.oled body, html.oled #overlay { background: #000; }
  html.oled #toast { background: #0b0b0d; }
</style>
</head>
<body>
<iframe id="sc" src="about:blank"></iframe>
<div id="overlay"><div id="overlay-msg">Loading…</div><div id="overlay-btns"></div></div>
<div id="toast"></div>
<script>
"use strict";
const qs = new URLSearchParams(location.search);
const projectId = qs.get("project");
const docPath = qs.get("doc") || "Script/script.fountain";
const docName = docPath.split("/").pop();
const theme = qs.get("theme") ? "&theme=" + encodeURIComponent(qs.get("theme")) : "";
if (qs.get("theme") === "oled") document.documentElement.classList.add("oled");
const API = "/api";
const clientId = (() => {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = new Uint8Array(16);
  crypto.getRandomValues(b);
  b[6] = b[6] & 0x0f | 0x40; b[8] = b[8] & 0x3f | 0x80;
  const h = [...b].map(x => x.toString(16).padStart(2, "0")).join("");
  return h.slice(0, 8) + "-" + h.slice(8, 12) + "-" + h.slice(12, 16) + "-" + h.slice(16, 20) + "-" + h.slice(20);
})();
let csrf = "", dirty = false, docSent = false, pending = 0, lockLost = false;
const $ = (id) => document.getElementById(id);
const overlay = (msg, btns) => {
  $("overlay").classList.remove("hidden");
  $("overlay-msg").textContent = msg;
  const box = $("overlay-btns"); box.innerHTML = "";
  for (const [label, fn] of btns || []) {
    const b = document.createElement("button"); b.textContent = label; b.onclick = fn; box.appendChild(b);
  }
};
const hideOverlay = () => $("overlay").classList.add("hidden");
const toast = (m) => { const t = $("toast"); t.textContent = m; t.style.display = "block"; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = "none", 4000); };
const fail = (m) => overlay(m, [["Close tab", () => window.close()]]);

async function api(path, opt = {}) {
  opt.headers = Object.assign({}, opt.headers, csrf && opt.method && opt.method !== "GET" ? { "x-csrf-token": csrf } : {});
  const r = await fetch(API + path, opt);
  if (r.status === 401) { location.href = "/app/"; throw new Error("auth"); }
  return r;
}

async function boot() {
  if (!projectId) return fail("No project specified.");
  const me = await (await api("/me")).json().catch(() => null);
  if (!me || !me.user) return overlay("Sign in first.", [["Open app", () => location.href = "/app/"]]);
  csrf = me.csrf || "";
  const lock = await api("/projects/" + projectId + "/locks", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ kind: "script", clientId })
  });
  const lr = await lock.json();
  if (!lock.ok && !lr.lock) return fail("Could not open the script.");
  if (lr.lock && !lr.acquired) {
    return overlay("This project's script is already open in another tab or device.", [
      ["Take over", async () => {
        await api("/projects/" + projectId + "/locks", { method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ kind: "script", clientId, force: true }) });
        boot();
      }],
      ["Close tab", () => window.close()]
    ]);
  }
  const p = await (await api("/projects/" + projectId)).json();
  const title = p.displayName || p.display_name || "";
  document.title = title ? title + " script - WFM" : "ScriptCraft - WFM";
  $("sc").src = "/scriptcraft/dist/index.html?project=" + encodeURIComponent(projectId) + theme;
  setInterval(heartbeat, 20000);
}

function heartbeat() {
  api("/projects/" + projectId + "/locks/heartbeat", { method: "POST",
    headers: { "content-type": "application/json" }, body: JSON.stringify({ kind: "script", clientId }) })
    .then(r => { if (r.status === 409) loseLock(); })
    .catch(() => {});
}

function loseLock() {
  if (lockLost) return;
  lockLost = true;
  overlay("This script was taken over in another tab or device. Changes here will no longer be saved.", [["Close tab", () => window.close()]]);
}

window.addEventListener("message", async (ev) => {
  if (ev.source !== $("sc").contentWindow || ev.origin !== location.origin) return;
  const d = ev.data || {};
  if (d.type === "scriptcraft:ready" || d.type === "scriptcraft:pull") {
    hideOverlay();
    if (d.type === "scriptcraft:ready" && docSent) return;
    docSent = true;
    sendDoc();
  }
  else if (d.type === "scriptcraft:save") { handleSave(d); }
  else if (d.type === "scriptcraft:dirty") { dirty = !!d.dirty; }
});

async function sendDoc() {
  try {
    const sr = await api("/shortcuts");
    const sc = sr.ok ? await sr.json().catch(() => null) : null;
    if (sc && sc.bindings) {
      const b = {};
      for (const [k, v] of Object.entries(sc.bindings)) {
        if (k.startsWith("sc.")) b[k.slice(3)] = v;
      }
      const meta = "wfm:" + JSON.stringify({ k: "shortcuts", b });
      $("sc").contentWindow.postMessage({ type: "scriptcraft:open", name: meta, bytes: new Uint8Array(0) }, location.origin);
    }
  } catch (_) {}
  const r = await api("/projects/" + projectId + "/download?path=" + encodeURIComponent(docPath));
  if (r.status === 404) return;
  if (!r.ok) { toast("Could not load the script (" + r.status + ")"); return; }
  const bytes = await r.arrayBuffer();
  $("sc").contentWindow.postMessage({ type: "scriptcraft:open", name: docName, bytes: new Uint8Array(bytes) }, location.origin);
}

async function handleSave(d) {
  if (lockLost) return;
  const name = (d.name || "export.bin").split("/").pop();
  const path = name === docName ? docPath : "Exports/" + name;
  const bin = atob(d.data || "");
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  pending++;
  try {
    const r = await api("/projects/" + projectId + "/files?path=" + encodeURIComponent(path) + "&clientId=" + encodeURIComponent(clientId),
      { method: "PUT", body: bytes });
    if (!r.ok) toast("Save failed (" + r.status + ")");
    else if (path === docPath) toast("Saved");
  } catch (e) {
    toast("Save failed");
  }
  pending--;
}

function releaseLock() {
  fetch(API + "/projects/" + projectId + "/locks/release?kind=script&clientId=" + encodeURIComponent(clientId), {
    method: "POST", keepalive: true,
    headers: { "x-csrf-token": csrf, "content-type": "application/json" }
  });
}
window.addEventListener("beforeunload", (e) => {
  releaseLock();
  if (dirty || pending > 0) { e.preventDefault(); e.returnValue = ""; }
});
window.addEventListener("pagehide", releaseLock);
boot().catch((e) => { if (!e || e.message !== "auth") fail("Could not open the script: " + ((e && e.message) || e)); });
</script>
</body>
</html>
