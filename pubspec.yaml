name: wfm
description: "Web Film Manager - film projects for a whole class."
publish_to: 'none'
version: 0.37.0+78

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  http: ^1.6.0
  intl: ^0.20.2
  web: ^1.1.1
  file_picker: 13.3.3
  url_launcher: ^6.3.3
  flutter_inappwebview: ^6.1.5
  webview_windows: ^0.4.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon.png
    - LICENSE
  fonts:
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
