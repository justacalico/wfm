name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build all release targets'
        type: boolean
        default: true
      create_release:
        description: 'Create a versioned release from this build'
        type: boolean
        default: false
      merge_request_id:
        description: 'Merge request ID'
        type: string
        default: ''
      merge_request_url:
        description: 'Merge request URL'
        type: string
        default: ''

permissions:
  contents: write
  actions: read

env:
  FLUTTER_VERSION: "3.47.7"
  COCOGITTO_VERSION: "7.0.0"
  APP_ID: "gitlab.httpanimations.wfm"

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup build metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_number: ${{ steps.meta.outputs.build_number }}
      build_all: ${{ steps.meta.outputs.build_all }}
      targets: ${{ steps.meta.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read version and build metadata
        id: meta
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/^version: //; s/+.*//')
          BUILD_NUMBER=$(grep '^version: ' pubspec.yaml | sed 's/.*+//')
          if [ -n "${{ inputs.build_all }}" ]; then
            BUILD_ALL="${{ inputs.build_all }}"
          else
            BUILD_ALL="true"
          fi
          if [ "$BUILD_ALL" = "true" ]; then
            TARGETS='[{"target":"linux","os":"ubuntu-latest","arch":"x86_64"},{"target":"linux-arm64","os":"ubuntu-24.04-arm","arch":"aarch64"},{"target":"web","os":"ubuntu-latest"}]'
          else
            TARGETS='[]'
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "build_all=$BUILD_ALL" >> "$GITHUB_OUTPUT"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wfm
          POSTGRES_PASSWORD: wfm
          POSTGRES_DB: wfm_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U wfm" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install cocogitto
        run: |
          curl -fsSL --retry 3 -o /tmp/cog.tar.gz "https://github.com/cocogitto/cocogitto/releases/download/${COCOGITTO_VERSION}/cocogitto-${COCOGITTO_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p /tmp/cog && tar -xzf /tmp/cog.tar.gz -C /tmp/cog
          sudo install -m 755 /tmp/cog/x86_64-unknown-linux-musl/cog /usr/local/bin/cog

      - name: Check commits
        if: github.event_name != 'pull_request'
        run: cog check

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: verify-server

      - name: Pub get
        run: |
          flutter pub get
          (cd landing && flutter pub get)

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test landing/lib landing/test

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos
          (cd landing && flutter analyze --no-fatal-infos)

      - name: Test with coverage
        run: flutter test --coverage

      - name: Require 100% line coverage
        run: |
          python3 - <<'PY'
          lf = lh = 0
          cur = ''
          missed = []
          for line in open('coverage/lcov.info'):
              line = line.strip()
              if line.startswith('SF:'):
                  cur = line[3:]
              elif line.startswith('LF:'):
                  lf += int(line[3:])
              elif line.startswith('LH:'):
                  lh += int(line[3:])
              elif line.startswith('DA:') and line.endswith(',0'):
                  missed.append(f'{cur}:{line[3:]}')
          if lf == 0 or lh != lf:
              print('\n'.join(missed))
              raise SystemExit(f'coverage {lh}/{lf}, need 100%')
          print(f'coverage {lh}/{lf} OK')
          PY

      - name: Landing test
        run: |
          cd landing
          flutter test

      - name: Server tests
        run: |
          cd server
          cargo test --locked

      - name: Server tests (postgres feature)
        env:
          WFM_TEST_PG: postgres://wfm:wfm@localhost:5432/wfm_test
        run: |
          cd server
          cargo test --locked --features postgres

  filmcraft:
    name: Build FilmCraft bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup wasm toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          curl -fsSL https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /opt
          echo "/opt/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: Build patched bundle
        run: bash scripts/build-filmcraft.sh

      - uses: actions/upload-artifact@v4
        with:
          name: filmcraft-dist
          path: filmcraft/dist

  scriptcraft:
    name: Build ScriptCraft bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup wasm toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          curl -fsSL https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /opt
          echo "/opt/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: Build patched bundle
        run: bash scripts/build-scriptcraft.sh

      - uses: actions/upload-artifact@v4
        with:
          name: scriptcraft-dist
          path: scriptcraft/dist

  deckcraft:
    name: Build DeckCraft bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup wasm toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          mkdir -p /opt/trunk
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /opt/trunk
          echo "/opt/trunk" >> "$GITHUB_PATH"

      - name: Build patched bundle
        run: bash scripts/build-deckcraft.sh

      - uses: actions/upload-artifact@v4
        with:
          name: deckcraft-dist
          path: deckcraft/dist

  build:
    name: Build ${{ matrix.target }}
    needs: [setup, verify, filmcraft, scriptcraft, deckcraft]
    if: ${{ needs.setup.outputs.build_all == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.targets) }}
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        if: matrix.target != 'linux-arm64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Flutter arm64
        uses: actions/cache@v4
        if: matrix.target == 'linux-arm64'
        with:
          path: /opt/flutter
          key: flutter-${{ env.FLUTTER_VERSION }}-linux-arm64

      - name: Setup Flutter arm64
        if: matrix.target == 'linux-arm64'
        run: |
          if [ ! -x /opt/flutter/bin/flutter ]; then
            rm -rf /opt/flutter
            git clone --depth 1 -b ${{ env.FLUTTER_VERSION }} https://github.com/flutter/flutter.git /opt/flutter
          fi
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory /opt/flutter
          /opt/flutter/bin/flutter --version

      - uses: Swatinem/rust-cache@v2
        if: matrix.target != 'web'
        with:
          workspaces: server
          key: server-${{ matrix.target }}

      - name: Pub get
        run: flutter pub get

      - name: Build web bundle
        if: matrix.target != 'web'
        run: |
          flutter build web --release --base-href /app/ --no-web-resources-cdn
          mkdir -p server/web/app
          cp -a build/web/. server/web/app/

      - name: Stage FilmCraft bundle
        if: matrix.target != 'web'
        run: |
          mkdir -p server/web/filmcraft
          cp filmcraft/wfm.html filmcraft/icon.svg filmcraft/VERSION server/web/filmcraft/

      - uses: actions/download-artifact@v4
        if: matrix.target != 'web'
        with:
          name: filmcraft-dist
          path: server/web/filmcraft/dist

      - name: Stage ScriptCraft bundle
        if: matrix.target != 'web'
        run: |
          mkdir -p server/web/scriptcraft
          cp scriptcraft/wfm.html scriptcraft/icon.svg scriptcraft/VERSION server/web/scriptcraft/

      - uses: actions/download-artifact@v4
        if: matrix.target != 'web'
        with:
          name: scriptcraft-dist
          path: server/web/scriptcraft/dist

      - name: Stage DeckCraft bundle
        if: matrix.target != 'web'
        run: |
          mkdir -p server/web/deckcraft
          cp deckcraft/wfm.html deckcraft/icon.svg deckcraft/VERSION server/web/deckcraft/

      - uses: actions/download-artifact@v4
        if: matrix.target != 'web'
        with:
          name: deckcraft-dist
          path: server/web/deckcraft/dist

      - name: Build server binary
        if: matrix.target != 'web'
        run: |
          cd server
          cargo build --release --locked --features postgres

      - name: Package server bundle
        if: matrix.target != 'web'
        run: |
          mkdir -p artifacts pkg
          cp server/target/release/wfm pkg/wfm
          cp docker-compose.yml .env.example README.md LICENSE pkg/
          tar -czf "artifacts/wfm-${VERSION}-linux-${ARCH}.tar.gz" -C pkg .
          (cd pkg && zip -qr "../artifacts/wfm-${VERSION}-linux-${ARCH}.zip" .)
          ls -la artifacts/

      - name: Package web bundle
        if: matrix.target == 'web'
        run: |
          flutter build web --release --base-href /app/ --no-web-resources-cdn
          mkdir -p artifacts
          (cd build/web && zip -qr "../../artifacts/wfm-${VERSION}-web.zip" .)
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: artifacts/
          retention-days: 400

  desktop:
    name: Desktop app ${{ matrix.name }}
    needs: [setup, verify]
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)) }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: linux
            triple: x86_64-unknown-linux-gnu
            flutter_arch: x64
            ext: tar.gz
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: linux
            triple: aarch64-unknown-linux-gnu
            flutter_arch: arm64
            ext: tar.gz
          - name: macos-arm64
            os: macos-latest
            target: macos
            triple: aarch64-apple-darwin
            ext: tar.gz
          - name: windows-x64
            os: windows-latest
            target: windows
            triple: x86_64-pc-windows-msvc
            ext: zip
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Linux build deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config rpm \
            libgtk-3-dev libasound2-dev libxkbcommon-dev libwayland-dev \
            libxcb1-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Cache Flutter arm64
        uses: actions/cache@v4
        if: matrix.name == 'linux-aarch64'
        with:
          path: /opt/flutter
          key: flutter-${{ env.FLUTTER_VERSION }}-linux-arm64

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        if: matrix.name != 'linux-aarch64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Flutter arm64
        if: matrix.name == 'linux-aarch64'
        run: |
          if [ ! -x /opt/flutter/bin/flutter ]; then
            rm -rf /opt/flutter
            git clone --depth 1 -b ${{ env.FLUTTER_VERSION }} https://github.com/flutter/flutter.git /opt/flutter
          fi
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory /opt/flutter
          /opt/flutter/bin/flutter --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/webview
          key: desktop-${{ matrix.name }}

      - name: Cache FilmCraft source build
        uses: actions/cache@v4
        with:
          path: .cache/filmcraft
          key: filmcraft-${{ matrix.name }}-${{ hashFiles('filmcraft/VERSION', 'filmcraft/patches/**', 'filmcraft/patches-native/**') }}

      - name: Pub get
        run: flutter pub get

      - name: Build FilmCraft native
        env:
          FILMCRAFT_SRC: ${{ github.workspace }}/.cache/filmcraft
        run: |
          if [ ! -d .cache/filmcraft/.git ]; then
            rm -rf .cache/filmcraft
            git clone --depth 1 --branch "v$(cat filmcraft/VERSION)" https://github.com/storytold/filmcraft .cache/filmcraft
          fi
          bash scripts/build-filmcraft-native.sh --target ${{ matrix.triple }}

      - name: Build webview helper
        run: bash scripts/build-webview.sh ${{ matrix.triple }}

      - name: Build desktop app
        run: flutter build $TARGET --release

      - name: Stage craft binaries
        run: bash scripts/package-desktop.sh $TARGET ${{ matrix.flutter_arch }}

      - name: Ad-hoc sign app bundle
        if: matrix.target == 'macos'
        run: codesign --force --deep --sign - build/macos/Build/Products/Release/wfm.app

      - name: Package desktop bundle
        run: |
          mkdir -p artifacts
          NAME="${{ matrix.name }}"
          case "$TARGET" in
            linux)
              tar -czf "artifacts/wfm-desktop-${VERSION}-${NAME}.tar.gz" -C build/linux/${{ matrix.flutter_arch }}/release/bundle .
              bash scripts/package-linux-pkg.sh "$VERSION" "${{ matrix.flutter_arch }}" artifacts
              ;;
            macos)
              cp desktop/macos/remove-quarantine.command desktop/macos/README.txt build/macos/Build/Products/Release/
              chmod +x build/macos/Build/Products/Release/remove-quarantine.command
              tar -czf "artifacts/wfm-desktop-${VERSION}-${NAME}.tar.gz" -C build/macos/Build/Products/Release wfm.app remove-quarantine.command README.txt
              ;;
            windows)
              (cd build/windows/x64/runner/Release && 7z a -tzip -r "../../../../../artifacts/wfm-desktop-${VERSION}-${NAME}.zip" . > /dev/null)
              ;;
          esac
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: artifacts/
          retention-days: 400

  native-release:
    name: Attach desktop binaries to release
    needs: [desktop, release]
    if: always() && needs.desktop.result == 'success' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Attach to release
        run: |
          ls -la release-assets/
          shopt -s nullglob
          files=(release-assets/wfm-desktop-*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no desktop artifacts found"
            exit 1
          fi
          gh release upload "${{ needs.release.outputs.release_tag }}" "${files[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  docker:
    name: Push image to GitLab registry
    needs: [verify]
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitLab registry
        uses: docker/login-action@v3
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_REGISTRY_USER }}
          password: ${{ secrets.GITLAB_REGISTRY_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          IMG=registry.gitlab.com/httpanimations/wfm
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
            echo "tags=$IMG:$V,$IMG:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMG:latest,$IMG:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=registry.gitlab.com/httpanimations/wfm:buildcache
          cache-to: type=registry,ref=registry.gitlab.com/httpanimations/wfm:buildcache,mode=max

  release:
    name: GitHub release
    needs: [setup, verify, build]
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.rel.outputs.tag }}
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.setup.outputs.build_all == 'true' && inputs.merge_request_id == '' && ((github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.create_release == 'true')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine release tag
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ needs.setup.outputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create tag for dispatch releases
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag -a "${{ steps.rel.outputs.tag }}" -m "Release ${{ steps.rel.outputs.tag }}" || true
          git push origin "${{ steps.rel.outputs.tag }}" || true

      - name: Download artifacts
        run: |
          mkdir -p merged-artifacts
          for t in $(echo '${{ needs.setup.outputs.targets }}' | jq -r '.[].target'); do
            gh run download "$GITHUB_RUN_ID" -n "$t" -D merged-artifacts
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          find merged-artifacts -maxdepth 1 -type f -name 'wfm-*' -exec cp {} release-assets/ \;
          git archive --format=zip --prefix="wfm-${{ steps.rel.outputs.tag }}/" -o release-assets/source.zip HEAD
          git archive --format=tar.gz --prefix="wfm-${{ steps.rel.outputs.tag }}/" -o release-assets/source.tar.gz HEAD
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Create release
        run: |
          gh release create "${{ steps.rel.outputs.tag }}" \
            --title "WFM ${{ steps.rel.outputs.tag }}" \
            --generate-notes \
            release-assets/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gitlab-sync:
    name: Sync release to GitLab
    runs-on: ubuntu-latest
    needs: [release, native-release]
    if: always() && needs.release.result == 'success' && needs.native-release.result == 'success'
    steps:
      - name: Trigger GitLab release-sync pipeline
        run: |
          curl -fsS --request POST \
            --form "token=${{ secrets.GITLAB_TRIGGER_TOKEN }}" \
            --form "ref=main" \
            --form "variables[RELEASE_TAG]=${{ needs.release.outputs.release_tag }}" \
            "https://gitlab.com/api/v4/projects/${{ secrets.GITLAB_PROJECT_ID }}/trigger/pipeline"
