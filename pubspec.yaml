name: wfm
description: "Web Film Manager - film projects for a whole class."
publish_to: 'none'
version: 0.49.0+95

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  http: ^1.6.0
  intl: ^0.20.2
  web: ^1.1.1
  file_picker: 13.3.3
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  package_info_plus: ^10.2.2
  path: ^1.9.1
  window_manager: 0.5.2
  flutter_markdown: 0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon.png
    - LICENSE
  fonts:
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
