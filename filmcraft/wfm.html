<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filmcraft - WFM</title>
<link rel="icon" href="/filmcraft/icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #101014; height: 100vh; overflow: hidden; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  #overlay { position: fixed; inset: 0; background: #101014; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; z-index: 10; color: #e6e6ea; font: 14px/1.4 system-ui, sans-serif; }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 20px; }
  #overlay p { color: #8d8d96; max-width: 420px; text-align: center; }
  #overlay button { background: #26262e; color: inherit; border: 1px solid #3a3a44; border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
  #toast { position: fixed; bottom: 16px; right: 16px; background: #26262e; color: #e6e6ea; border: 1px solid #3a3a44; border-radius: 8px; padding: 10px 14px; display: none; z-index: 20; max-width: 340px; font: 13px/1.4 system-ui, sans-serif; }
  #upl { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 30; font: 13px/1.4 system-ui, sans-serif; }
  #upl[hidden] { display: none; }
  #upl-card { background: #1c1c22; border: 1px solid #3a3a44; border-radius: 10px; padding: 16px 18px; width: 380px; max-width: 90vw; max-height: 70vh; overflow-y: auto; color: #e6e6ea; }
  #upl-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .upl-row { margin-bottom: 10px; }
  .upl-row:last-child { margin-bottom: 0; }
  .upl-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 4px; }
  .upl-mid { display: flex; align-items: center; gap: 10px; }
  .upl-bar { flex: 1; height: 6px; background: #26262e; border-radius: 3px; overflow: hidden; }
  .upl-fill { height: 100%; width: 0; background: #7c6cf0; transition: width .15s; }
  .upl-row.err .upl-fill { background: #e05c5c; }
  .upl-row.done .upl-fill { background: #4caf7d; }
  .upl-pct { min-width: 44px; text-align: right; color: #8d8d96; }
</style>
</head>
<body>
<div id="overlay"><h1>Filmcraft</h1><p id="overlay-msg">Loading…</p><div id="overlay-btns"></div></div>
<iframe id="fc" title="FilmCraft" allow="fullscreen; clipboard-read; clipboard-write" allowfullscreen></iframe>
<div id="upl" hidden><div id="upl-card"><div id="upl-title">Uploading…</div><div id="upl-list"></div></div></div>
<div id="toast"></div>
<script>
"use strict";
let fcReady = false;
const fcFail = (msg) => {
  if (fcReady) return;
  const o = document.getElementById("overlay");
  o.classList.remove("hidden");
  document.getElementById("overlay-msg").textContent = msg;
  const box = document.getElementById("overlay-btns");
  box.innerHTML = "";
  const b = document.createElement("button");
  b.textContent = "Back to WFM";
  b.onclick = () => location.href = "/app/";
  box.appendChild(b);
};
setTimeout(() => fcFail("FilmCraft could not load in this browser."), 60000);
addEventListener("error", (e) => fcFail("FilmCraft could not load in this browser." + ((e && e.message) ? " " + e.message : "")));
</script>
<script>
"use strict";
const qs = new URLSearchParams(location.search);
const projectId = qs.get("project");
const renderId = qs.get("render");
const theme = qs.get("theme") ? "&theme=" + encodeURIComponent(qs.get("theme")) : "";
const API = "/api";
const clientId = (() => {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = new Uint8Array(16);
  if (crypto.getRandomValues) crypto.getRandomValues(b);
  else for (let i = 0; i < 16; i++) b[i] = (Math.random() * 256) | 0;
  b[6] = b[6] & 0x0f | 0x40; b[8] = b[8] & 0x3f | 0x80;
  const h = [...b].map(x => x.toString(16).padStart(2, "0")).join("");
  return h.slice(0, 8) + "-" + h.slice(8, 12) + "-" + h.slice(12, 16) + "-" + h.slice(16, 20) + "-" + h.slice(20);
})();
let csrf = "", dirty = false, docSent = false, pending = 0, docName = "project.fcproj", docErrors = 0, lockLost = false;
const FMT_EXT = {
  h264: ".mp4", hevc: ".mp4", prores: ".mov", dnxhr: ".mov", apv: ".mp4",
  mjpeg: ".avi", "mxf-op1a": ".mxf", "mxf-opatom": ".mxf",
  png: ".png", tiff: ".tiff", bmp: ".bmp", jpg: ".jpg", tga: ".tga", dpx: ".dpx",
  exr: ".exr", gif: ".gif", wav: ".wav", aiff: ".aiff", aac: ".m4a", mp3: ".mp3", flac: ".flac"
};
const $ = (id) => document.getElementById(id);
const overlay = (msg, btns) => {
  $("overlay").classList.remove("hidden");
  $("overlay-msg").textContent = msg;
  const box = $("overlay-btns"); box.innerHTML = "";
  for (const [label, fn] of btns || []) {
    const b = document.createElement("button"); b.textContent = label; b.onclick = fn; box.appendChild(b);
  }
};
const hideOverlay = () => $("overlay").classList.add("hidden");
const toast = (m) => { const t = $("toast"); t.textContent = m; t.style.display = "block"; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = "none", 4000); };
const cleanName = (s) => {
  const n = (s || "").replace(/[\\/:*?"<>|\x00-\x1f]+/g, " ").replace(/\s+/g, " ").trim().replace(/^\.+|\.+$/g, "").trim();
  return n || "Project";
};

async function api(path, opt = {}) {
  opt.headers = Object.assign({}, opt.headers, csrf && opt.method && opt.method !== "GET" ? { "x-csrf-token": csrf } : {});
  const r = await fetch(API + path, opt);
  if (r.status === 401) { location.href = "/app/"; throw new Error("auth"); }
  return r;
}

async function boot() {
  if (!projectId) return fcFail("No project specified.");
  const me = await (await api("/me")).json().catch(() => null);
  if (!me || !me.user) return overlay("Sign in first.", [["Open app", () => location.href = "/app/"]]);
  csrf = me.csrf || "";
  if (renderId) {
    const p = await (await api("/projects/" + projectId)).json();
    const title = p.displayName || p.display_name || "";
    document.title = "Rendering" + (title ? " " + title : "") + " - WFM";
    docName = cleanName(title) + ".fcproj";
    $("fc").src = "/filmcraft/dist/index.html?host=parent&fresh" + theme;
    return;
  }
  const lock = await api("/projects/" + projectId + "/locks", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ kind: "edit", clientId })
  });
  const lr = await lock.json();
  if (!lock.ok && !lr.lock) return fcFail("Could not open the project.");
  if (lr.lock && !lr.acquired) {
    return overlay("This project is already open in another tab or device.", [
      ["Take over", async () => {
        await api("/projects/" + projectId + "/locks", { method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ kind: "edit", clientId, force: true }) });
        boot();
      }],
      ["Close tab", () => window.close()]
    ]);
  }
  const p = await (await api("/projects/" + projectId)).json();
  const title = p.displayName || p.display_name || "";
  document.title = title ? title + " - WFM" : "Filmcraft - WFM";
  docName = cleanName(title) + ".fcproj";
  $("fc").src = "/filmcraft/dist/index.html?host=parent&fresh" + theme;
  setInterval(heartbeat, 20000);
}

function heartbeat() {
  api("/projects/" + projectId + "/locks/heartbeat", { method: "POST",
    headers: { "content-type": "application/json" }, body: JSON.stringify({ kind: "edit", clientId }) })
    .then(r => { if (r.status === 409) loseLock(); })
    .catch(() => {});
}

function loseLock() {
  if (lockLost) return;
  lockLost = true;
  overlay("This project was taken over in another tab or device. Changes here will no longer be saved.", [["Close tab", () => window.close()]]);
}

window.addEventListener("message", async (ev) => {
  if (ev.source !== $("fc").contentWindow || ev.origin !== location.origin) return;
  const d = ev.data || {};
  if (d.type === "filmcraft:ready") {
    fcReady = true;
    hideOverlay();
    if (!docSent) {
      docSent = true;
      if (renderId) sendDoc().then(runRender).catch(e => finishRender(e.message || "load failed"));
      else sendDoc();
    }
  }
  else if (d.type === "filmcraft:save") { handleSave(d); }
  else if (d.type === "filmcraft:dirty") { dirty = !!d.dirty; }
  else if (d.type === "filmcraft:failed") { fcFail("FilmCraft could not start: " + (d.error || "unknown error")); }
});

function send(meta, bytes) {
  const name = "wfm:" + JSON.stringify(meta);
  $("fc").contentWindow.postMessage({ type: "filmcraft:open", name, bytes }, location.origin, [bytes instanceof ArrayBuffer ? bytes : bytes.buffer]);
}

async function listFiles(path) {
  const r = await api("/projects/" + projectId + "/files?path=" + encodeURIComponent(path));
  const list = await r.json().catch(() => []);
  let out = [];
  for (const e of Array.isArray(list) ? list : []) {
    if (e.type === "dir") out.push(e, ...(await listFiles(e.path)));
    else out.push(e);
  }
  return out;
}

const MEDIA_EXT = /\.(mp4|mov|mkv|webm|avi|mts|m2ts|mxf|mp3|wav|aac|flac|ogg|oga|m4a|opus|png|jpe?g|webp|gif|tiff?|bmp|srt|vtt|dng|exr|hdr)$/i;

const sentFolders = new Set();
const sentMedia = new Set();

async function pushFiles(entries) {
  for (const d of entries.filter(e => e.type === "dir" && e.path !== "Exports" && !e.path.startsWith("Exports/"))) {
    if (sentFolders.has(d.path)) continue;
    sentFolders.add(d.path);
    send({ k: "folder", p: d.path }, new ArrayBuffer(0));
  }
  const media = entries
    .filter(e => e.type !== "dir" && !e.path.startsWith("Exports/") && !e.name.endsWith(".fcproj") && MEDIA_EXT.test(e.name))
    .sort((a, b) => (a.path < b.path ? -1 : 1));
  for (const m of media) {
    if (sentMedia.has(m.path)) continue;
    sentMedia.add(m.path);
    send({ k: "media-ref", p: m.path, s: m.size, u: API + "/projects/" + projectId + "/download?path=" + encodeURIComponent(m.path) }, new ArrayBuffer(0));
  }
}

async function sendDoc() {
  try {
    const sr = await api("/shortcuts");
    const sc = sr.ok ? await sr.json().catch(() => null) : null;
    if (sc && sc.bindings) send({ k: "shortcuts", b: sc.bindings }, new ArrayBuffer(0));
  } catch (_) {}
  let entries = [];
  try {
    entries = await listFiles("");
    await pushFiles(entries);
  } catch (_) { docErrors++; }
  const hasDoc = entries.some(e => e.type !== "dir" && e.path === "project.fcproj");
  const r = await api("/projects/" + projectId + "/download?path=project.fcproj");
  if (!r.ok && hasDoc) docErrors++;
  if (docErrors) toast(docErrors + " file(s) could not be downloaded");
  const bytes = r.ok ? await r.arrayBuffer() : new ArrayBuffer(0);
  send({ k: "doc", n: docName }, bytes);
}

function binFolders(bin, prefix, out) {
  for (const c of (bin && bin.children) || []) {
    const b = c.Bin;
    if (!b) continue;
    const name = String(b.name || "").replace(/[\/\\:]/g, "-").trim();
    if (!name) continue;
    const p = prefix ? prefix + "/" + name : name;
    out.push(p);
    binFolders(b, p, out);
  }
}

async function syncBins(bytes) {
  try {
    const doc = JSON.parse(new TextDecoder().decode(bytes));
    const roots = new Set(["Raw", "Audio", "Images", "Exports"]);
    const dirs = [];
    binFolders(doc && doc.project && doc.project.root, "", dirs);
    for (let d of new Set(dirs)) {
      if (!roots.has(d.split("/")[0])) d = "Raw/" + d;
      await api("/projects/" + projectId + "/files/mkdir", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ path: d })
      });
    }
  } catch (_) {}
}

const uplRows = new Map();
function uplRow(path) {
  let row = uplRows.get(path);
  if (!row) {
    row = document.createElement("div");
    row.className = "upl-row";
    row.innerHTML = '<div class="upl-name"></div><div class="upl-mid"><div class="upl-bar"><div class="upl-fill"></div></div><div class="upl-pct"></div></div>';
    row.querySelector(".upl-name").textContent = path;
    $("upl-list").appendChild(row);
    uplRows.set(path, row);
  }
  $("upl").hidden = false;
  return row;
}
function uplSet(path, frac, cls, label) {
  const row = uplRow(path);
  row.className = "upl-row" + (cls ? " " + cls : "");
  row.querySelector(".upl-fill").style.width = Math.round(frac * 100) + "%";
  row.querySelector(".upl-pct").textContent = label || Math.round(frac * 100) + "%";
}
function uplRemove(path, delay) {
  const row = uplRows.get(path);
  uplRows.delete(path);
  setTimeout(() => {
    if (row) row.remove();
    if (!uplRows.size) $("upl").hidden = true;
  }, delay);
}
async function uploadMedia(path, bytes) {
  let x = await uploadOnce(path, bytes).catch(() => null);
  if (!x || x.status >= 400) {
    await new Promise(r => setTimeout(r, 2000));
    x = await uploadOnce(path, bytes);
  }
  return x;
}

function xhrPut(url, body, onUp) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("PUT", url);
    if (csrf) x.setRequestHeader("x-csrf-token", csrf);
    if (onUp) x.upload.onprogress = onUp;
    x.onload = () => resolve(x);
    x.onerror = () => reject(new Error("network"));
    x.timeout = 300000;
    x.ontimeout = () => reject(new Error("timeout"));
    x.send(body);
  });
}

async function uploadOnce(path, bytes) {
  const mb = parseInt(localStorage.getItem("flutter.chunkMb") || "80", 10);
  let size = mb * 1048576;
  if (bytes.length <= size) {
    return xhrPut(API + "/projects/" + projectId + "/files?path=" + encodeURIComponent(path), bytes,
      (e) => { if (e.lengthComputable) uplSet(path, e.loaded / e.total); });
  }
  const st = await api("/projects/" + projectId + "/files/upload", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ path: path, clientId: clientId })
  });
  if (!st.ok) return { status: st.status, responseText: await st.text() };
  const uid = (await st.json()).id;
  let off = 0;
  try {
    while (off < bytes.length) {
      const end = Math.min(off + size, bytes.length);
      const x = await xhrPut(API + "/uploads/" + uid + "/chunk?offset=" + off,
        bytes.subarray(off, end),
        (e) => { if (e.lengthComputable) uplSet(path, (off + e.loaded) / bytes.length); });
      if (x.status === 413 && size > 1048576) { size = Math.floor(size / 2); continue; }
      if (x.status >= 400) return x;
      off = end;
    }
    const fin = await api("/uploads/" + uid + "/complete", { method: "POST" });
    return { status: fin.status, responseText: await fin.text() };
  } catch (e) {
    await api("/uploads/" + uid, { method: "DELETE" }).catch(() => {});
    throw e;
  }
}

async function handleSave(d) {
  let path = d.name || "export.bin";
  const media = !!(d.id && !d.id.includes("..") && !d.id.startsWith("/") && !d.id.includes("\\") && d.id.trim());
  if (media) path = d.id;
  else if (path.toLowerCase().endsWith(".fcproj")) {
    if (path === docName || d.saveAs) path = "project.fcproj";
    else return;
  } else if (!path.startsWith("Raw/")) {
    path = "Exports/" + path.replace(/^.*\//, "");
  }
  if (path === "project.fcproj" && (renderId || lockLost)) return;
  pending++;
  try {
    if (media) {
      uplSet(path, 0);
      const x = await uploadMedia(path, d.bytes);
      if (x.status >= 400) {
        uplSet(path, 1, "err", "Failed");
        uplRemove(path, 4000);
        toast("Save failed: " + x.responseText);
      } else {
        uplSet(path, 1, "done", "Done");
        uplRemove(path, 800);
      }
    } else {
      const r = await api("/projects/" + projectId + "/files?path=" + encodeURIComponent(path) + "&clientId=" + encodeURIComponent(clientId), {
        method: "PUT", body: d.bytes
      });
      if (!r.ok) toast("Save failed: " + (await r.text()));
      else if (path === "project.fcproj") { dirty = false; syncBins(d.bytes); }
      else toast("Saved " + path);
    }
  } catch (e) {
    if (media) { uplSet(path, 1, "err", "Failed"); uplRemove(path, 4000); }
    toast("Save failed");
  }
  pending--;
}

let rendering = false, renderDone = false, renderOut = "";
const fcExec = (id, params) => $("fc").contentWindow.filmcraft.execute(id, params || {});

async function reportProgress(p) {
  const r = await api("/renders/" + renderId + "/progress", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ progress: p })
  });
  return r.ok ? (await r.json()).canceled === true : false;
}

async function finishRender(error) {
  if (renderDone) return;
  renderDone = true;
  rendering = false;
  for (let i = 0; i < 600 && pending > 0; i++) await new Promise(r => setTimeout(r, 500));
  if (!error && pending > 0) error = "output upload did not finish";
  if (!error && renderOut) {
    try {
      const r = await api("/projects/" + projectId + "/files?path=Exports");
      const list = await r.json().catch(() => []);
      const name = renderOut.replace(/^.*\//, "");
      const ok = Array.isArray(list) && list.some(e => e.type !== "dir" && (e.path === "Exports/" + name || e.name === name));
      if (!ok) error = "output missing from Exports";
    } catch (_) {}
  }
  try {
    await api("/renders/" + renderId + "/finish", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ error: error || "" })
    });
  } catch (_) {}
  if (error) overlay("Render failed: " + error);
  else overlay("Render finished. The output is in Exports.", [["Close tab", () => window.close()]]);
}

async function runRender() {
  const r = await api("/projects/" + projectId + "/renders");
  const jobs = await r.json().catch(() => []);
  const job = (Array.isArray(jobs) ? jobs : []).find(j => j.id === renderId);
  if (!job) return finishRender("no such render job");
  let spec;
  try { spec = JSON.parse(job.spec || "{}"); } catch (_) { return finishRender("bad render spec"); }
  const fmt = (spec.params || {}).format || ((spec.params || {}).settings || {}).format;
  const out = (spec.output || "export") + (FMT_EXT[fmt] || ".mp4");
  renderOut = out;

  overlay("Preparing the render…");
  const t0 = Date.now();
  for (;;) {
    let insp = null;
    try { insp = await fcExec("project.inspect", {}); } catch (_) {}
    if (insp && insp.root && (insp.root.children || []).length) break;
    if (Date.now() - t0 > 120000) return finishRender("project did not load");
    await new Promise(r => setTimeout(r, 500));
  }
  for (;;) {
    let res = null;
    try { res = await fcExec("media.findMissing", {}); } catch (_) {}
    const left = ((res || {}).missing || []).filter(m => m.status === "missing");
    if (res && !left.length) break;
    if (Date.now() - t0 > 240000) return finishRender(left.length ? "media missing" : "media check timed out");
    await new Promise(r => setTimeout(r, 500));
  }

  const params = Object.assign({}, spec.params || {}, { wait: true, path: out });
  if (spec.sequence) params.sequence = spec.sequence;
  uplSet("Render", 0);
  rendering = true;
  hideOverlay();
  let exportJob = 0, canceled = false;
  const poll = setInterval(async () => {
    try {
      const list = await fcExec("jobs.list", {});
      const run = (Array.isArray(list) ? list : []).filter(j => !j.finished);
      const j = exportJob ? run.find(j => j.id === exportJob) : run[run.length - 1];
      if (!j) return;
      exportJob = j.id;
      uplSet("Render", j.progress || 0, "", j.status || Math.round((j.progress || 0) * 100) + "%");
      if (await reportProgress(j.progress || 0)) {
        canceled = true;
        fcExec("jobs.cancel", { job: exportJob }).catch(() => {});
      }
    } catch (_) {}
  }, 1000);
  try {
    await fcExec("file.exportMedia", params);
    clearInterval(poll);
    if (canceled) return finishRender("canceled");
    uplSet("Render", 1, "done", "Done");
    uplRemove("Render", 1500);
    finishRender("");
  } catch (e) {
    clearInterval(poll);
    uplSet("Render", 1, "err", "Failed");
    uplRemove("Render", 4000);
    finishRender(canceled ? "canceled" : (e && e.message) || "export failed");
  }
}

function releaseLock() {
  fetch(API + "/projects/" + projectId + "/locks/release?kind=edit&clientId=" + encodeURIComponent(clientId), {
    method: "POST", keepalive: true,
    headers: { "x-csrf-token": csrf, "content-type": "application/json" }
  });
}
window.addEventListener("beforeunload", (e) => {
  releaseLock();
  if (dirty || pending > 0 || rendering) { e.preventDefault(); e.returnValue = ""; }
});
window.addEventListener("pagehide", releaseLock);
setInterval(() => {
  try {
    const s = $("fc").contentDocument?.getElementById("status");
    if (s && s.className === "err") fcFail(s.textContent || "FilmCraft could not start.");
  } catch (_) {}
}, 1500);
async function syncMedia() {
  if (renderId) return;
  try { await pushFiles(await listFiles("")); } catch (_) {}
}
setInterval(syncMedia, 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) syncMedia(); });
window.addEventListener("focus", syncMedia);
boot().catch((e) => { if (!e || e.message !== "auth") fcFail("Could not open the project: " + ((e && e.message) || e)); });
</script>
</body>
</html>
