[package]
name = "wfm"
version = "0.5.13"
edition = "2021"
description = "Web Film Manager - self-hosted media project manager with on-device and server rendering"
license = "AGPL-3.0-only"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-rusqlite = "0.6"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
subtle = "2"
hex = "0.4"
tower-http = { version = "0.6", features = ["cors", "set-header", "compression-br", "compression-gzip"] }
rust-embed = "8"
ipnet = "2"
mime_guess = "2"
futures = "0.3"
http-body-util = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
tokio-util = { version = "0.7", features = ["io"] }
regex = "1"
percent-encoding = "2"
async-trait = "0.1"
rust-s3 = { version = "0.38", default-features = false, features = ["with-tokio"] }
sqlx = { version = "0.8", optional = true, default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }

[features]
default = []
postgres = ["dep:sqlx"]

[profile.release]
lto = true
codegen-units = 1
strip = true
